name: Parking geometry and configuration
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU math dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.11.4 opencv-python-headless==4.8.1.78 PyYAML==6.0.2
      - name: Validate shared presets and launch paths
        run: |
          python tools/check_sensor_preset.py
          python tools/check_topic_contract.py
          python tools/check_launch_params.py
          python tools/check_node_imports.py
      - name: Verify lens, coordinate, timing and calibration math
        env:
          PYTHONPATH: src/perception/drivable_bev/src:src/perception/camera_semantic_perception/src
        run: |
          python -m unittest discover -s src/perception/drivable_bev/test -p 'test_fisheye_svm.py'
          python -m unittest discover -s src/perception/drivable_bev/test -p 'test_svm*.py'
      - name: Verify parking state, GT preservation, coordinates and evaluation
        env:
          PYTHONPATH: src/vip3_parking/src
        run: python -m unittest discover -s src/vip3_parking/test
