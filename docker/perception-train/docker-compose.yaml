# TwinLiteNet+ 학습 컨테이너. MORAI 와 통신하지 않으므로 네트워크 설정이 없다.
services:
  vip3-perception-train:
    build:
      context: .
      dockerfile: Dockerfile
    image: vip3/perception-train:dev
    container_name: vip3-perception-train
    gpus: all
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - VIP3_DATA=/data
      - TWINLITE_ROOT=/opt/baselines/TwinLiteNetPlus
      - PYTHONPATH=/root/ws/src/perception
    volumes:
      - ../..:/root/ws:rw
      # 학습은 데이터셋을 읽기만 한다. 수집 원본을 학습이 망가뜨리지 못하게 ro 로 건다.
      - ${VIP3_DATA:-../../../data}:/data:ro
      # 공식 baseline 은 저장소 밖에 두고 로더가 커밋으로 핀한다.
      - ${TWINLITE_SOURCE:-../../../external/baselines/TwinLiteNetPlus}:/opt/baselines/TwinLiteNetPlus:ro
    shm_size: "8gb"
    stdin_open: true
    tty: true
    command: ["tail", "-f", "/dev/null"]
