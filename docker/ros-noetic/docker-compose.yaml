# Proposed runtime name; this file alone does not create a container.
# Team connection: use 9090 for MORAI, Docker publication and rosbridge.
name: vip3-parking
services:
  vip3-ros-noetic:
    build:
      context: ../..
      dockerfile: docker/ros-noetic/Dockerfile
    image: ${VIP3_IMAGE:-vip3/parking-ros:noetic}
    container_name: ${VIP3_CONTAINER_NAME:-vip3-parking-ros}
    init: true
    ports:
      - "127.0.0.1:${MORAI_BRIDGE_PORT:-9090}:${MORAI_BRIDGE_PORT:-9090}"
    environment:
      - MORAI_BRIDGE_PORT=${MORAI_BRIDGE_PORT:-9090}
      - VIP3_DATA=/data
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/vip3-xdg-runtime
      - ROS_MASTER_URI=http://127.0.0.1:11311
      - ROS_IP=127.0.0.1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../..:/root/ws:rw
      - ${VIP3_DATA:-../../../data}:/data:rw
      # Keep root-owned catkin outputs out of the shared Git working tree.
      - build_cache:/root/ws/build
      - devel_cache:/root/ws/devel
    shm_size: "512mb"
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
volumes:
  build_cache:
  devel_cache:
