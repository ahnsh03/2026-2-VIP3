name: parking_core
description: "261110 주차 수집 — 어안 4카메라 + ego, 평가용 objects/collision"
collect_hz: 5
mode: latest_timer
max_frames: 0
require_ego: true
map: R_KR_PG_KATRI
vehicle: 2023_Hyundai_ioniq5
bridge_type: rosbridge
lidar_format: bin_xyzi
notes: |
  rosbridge 단일 WebSocket 으로 카메라 4대가 흐른다. collect_hz 를 올리기 전에
  `rostopic hz` 로 카메라별 실제 수신율을 먼저 확인한다 (docs/simulator.md §5).
  네 카메라 모두 640x480, FOV 179, 10Hz. LiDAR/GPS/IMU는 이번 센서셋에 없다.

channels:
  ego: true
  objects: true
  collision: true
  lidar: false
  gps: false
  imu: false
  cam_front: true
  cam_left: true
  cam_right: true
  cam_rear: true

topics:
  ego: /Ego_topic
  objects: /Object_topic
  collision: /CollisionData
  lidar: /velodyne_points
  gps: /gps
  imu: /imu
  cam_front: /cam_front/image_jpeg/compressed
  cam_left: /cam_left/image_jpeg/compressed
  cam_right: /cam_right/image_jpeg/compressed
  cam_rear: /cam_rear/image_jpeg/compressed
