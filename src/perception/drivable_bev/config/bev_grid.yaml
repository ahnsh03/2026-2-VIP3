# 주차용 근거리 BEV 격자.
# ASMC 주행용은 x[-5,20] y[-8,8] res 0.10 이었다 (전방 20 m, 후방 5 m). 주차는 차 주변
# 360도 근거리가 전부라 범위를 대칭으로 줄이고 해상도를 두 배로 올린다.
#
#   res 0.05 → 15 cm 주차선이 셀 3개. res 0.10 이면 선을 못 본다.
#   400 x 320 = 128,000 셀. ASMC 는 250 x 160 = 40,000 이었다 (3.2배).
#   뷰당 warp 2~3회 x 4뷰라 fused rate 가 ASMC 의 10 Hz 보다 낮게 나올 수 있다.
#   느리면 첫 번째 레버는 resolution 0.05 → 0.08 (20/0.08=250, 16/0.08=200 로 정수),
#   두 번째는 뷰별 debug publisher 끄기.
frame_id: base_link

x_min_m: -10.0
x_max_m: 10.0
y_min_m: -8.0
y_max_m: 8.0
resolution_m: 0.05

# 뷰별 debug 투영은 모델 출력 주기 위에 둔다. 배포용 throttle 은 fusion 노드가 가진다.
max_publish_hz: 20.0
# 이 격자의 최대 대각선은 sqrt(10^2+8^2)=12.8 m 다. 25 m 는 여유를 둔 값이고,
# 멀수록 지면 평면 가정 오차가 커지므로 필요 이상 키우지 않는다.
max_ground_range_m: 25.0
min_camera_depth_m: 0.10
diagnostics_interval_sec: 2.0
