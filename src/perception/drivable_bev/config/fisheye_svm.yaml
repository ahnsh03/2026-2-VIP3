# INITIAL GUESS, NOT MORAI calibration: f=width/FOV_rad, D=0.
# Vehicle geometry is loaded separately; lens and occlusion still require calibration.
# Preview only; do not train/evaluate SS-PSD with this output before calibration.
calibration_status: uncalibrated_equidistant_initialization
source_sensor_preset: config/morai/261110_VIP3_Sensor_26.R1.H3.json
projection_model: opencv_fisheye
output_size: 512
extent_m: 10.0
vehicle_geometry_file: vehicles/2023_hyundai_ioniq5.yaml
publish_hz: 5.0
max_age_s: 0.5
sync_slop_s: 0.06
# This compensates body attitude and inter-camera capture times on a locally level
# map surface. Road grade is NOT observable from body orientation alone.
pose_compensation:
  enabled: true
  quaternion_convention: morai_26r1_x_flipped
  topic: /tf
  parent_frame: map
  child_frame: base_link
  max_age_s: 0.5
  max_offset_s: 0.05
  max_tilt_deg: 15.0
  normal_map: [0.0, 0.0, 1.0]
  ground_assumption: locally_level_map_surface_fixed_ride_height
cameras:
  front:
    sensor_id: 1
    topic: /cam_front/image_jpeg/compressed
    frame_id: cam_front
    width: 1280
    height: 960
    translation_m:
    - 3.85
    - 0.0
    - 0.3
    rotation_deg:
    - 0.0
    - 35.0
    - 0.0
    K:
    - - 409.71283674159423
      - 0
      - 640.0
    - - 0
      - 409.71283674159423
      - 480.0
    - - 0
      - 0
      - 1
    D:
    - 0.0
    - 0.0
    - 0.0
    - 0.0
    max_ray_angle_deg: 89.5
