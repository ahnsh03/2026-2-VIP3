# 4대 원본 RGB 서라운드 BEV. 캘리브레이션 확인과 발표용 그림 전용이다.
# 주차 격자보다 조금 넓게 봐서 지면 평면 가정이 어디서 깨지는지 눈으로 보이게 한다.
frame_id: base_link
x_min_m: -12.0
x_max_m: 12.0
y_min_m: -10.0
y_max_m: 10.0
resolution_m: 0.05

views: [front, left, right, rear]

max_ground_range_m: 25.0
min_camera_depth_m: 0.10
max_publish_hz: 5.0
camera_sync_slop_ms: 60.0
jpeg_quality: 90

# 미터 격자를 겹쳐 그린다. 주차선이 격자와 평행하지 않거나 뷰 경계에서 꺾이면
# pitch 부호 또는 ground_plane.z_at_origin_m 가 틀린 것이다.
draw_metric_grid: true
metric_grid_step_m: 1.0

edge_taper_fraction: 0.12
near_full_quality_radius_m: 6.0
max_quality_radius_m: 12.0
boundary_weight: 0.20

diagnostics_interval_sec: 2.0
