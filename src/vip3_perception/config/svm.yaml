# MORAI 26.R1.H3 / Ioniq5 / four 179 deg 1280x960 cameras.
# Ego TF Euler decoding differs from camera-local TF. Nominal mounts are fixed.
# Image-only stereo ground refinement is bounded; ASSUMED means no visual support.
# Preview calibration: see calibration/261112_validation.json and docs/system/svm-calibration.md.
calibration_status: simulator_multiview_preview
source_sensor_preset: config/morai/261110_VIP3_Sensor_26.R1.H3.json
projection_model: opencv_fisheye
output_size: 512
extent_m: 10.0
vehicle_geometry_file: vehicles/2023_hyundai_ioniq5.yaml
publish_hz: 10.0
max_age_s: 0.5
sync_slop_s: 0.06
pose_compensation:
  enabled: true
  quaternion_convention: morai_26r1_ego_euler
  topic: /tf
  parent_frame: map
  child_frame: base_link
  max_age_s: 0.5
  max_offset_s: 0.05
  max_tilt_deg: 15.0
  normal_map:
  - 0.0
  - 0.0
  - 1.0
  ground_assumption: visual_local_plane_when_supported_else_level_map_fixed_ride_height
cameras:
  front:
    sensor_id: 1
    topic: /cam_front/image_jpeg/compressed
    frame_id: cam_front
    width: 1280
    height: 960
